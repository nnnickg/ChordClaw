[package]
name = "chordclaw-wasm"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "WebAssembly bindings exposing the ChordClaw voicing and identify engines to JavaScript"
publish = false

[lib]
# rlib alongside cdylib so the JSON-contract tests can link under `cargo test`.
crate-type = ["cdylib", "rlib"]

# Features are additive: each adds one API, and both can be built together.
# The website builds two minimal bundles (one per feature) via --no-default-features.
[features]
default = ["voicings"]
voicings = []
identify = []

[dependencies]
chordclaw-core.workspace = true
console_error_panic_hook = "0.1.7"
serde.workspace = true
serde_json.workspace = true
wasm-bindgen.workspace = true

[lints]
workspace = true
